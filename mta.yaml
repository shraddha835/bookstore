_schema-version: "3.3"
ID: bookstore
version: 1.0.0
description: Bookstore CAP Application

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
        - node scripts/fix-hdi-deploy.js

modules:

  - name: bookstore-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: bookstore-hana
      - name: bookstore-auth

  - name: bookstore-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bookstore-hana

  - name: project1
    type: html5
    path: app/project1
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: bookstore-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: bookstore-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: artifacts/
      requires:
        - name: project1
          artifacts:
            - project1.zip
          target-path: artifacts/

  - name: bookstore-destinations
    type: com.sap.application.content
    path: .
    requires:
      - name: bookstore-destination-service
        parameters:
          content-target: true

      - name: bookstore-auth
        parameters:
          service-key:
            name: bookstore-auth-key

      - name: bookstore-html5-host
        parameters:
          service-key:
            name: bookstore-html5-host-key

    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:

            - Name: bookstore-html5-repository
              ServiceInstanceName: bookstore-html5-host
              ServiceKeyName: bookstore-html5-host-key
              sap.cloud.service: bookstore

            - Name: bookstore-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: bookstore-auth
              ServiceKeyName: bookstore-auth-key
              sap.cloud.service: bookstore

    build-parameters:
      no-source: true


resources:

  - name: bookstore-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: bookstore-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json

  - name: bookstore-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:

              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true

              - Name: ui5
                URL: https://ui5.sap.com
                ProxyType: Internet
                Type: HTTP
                Authentication: NoAuthentication

  - name: bookstore-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: bookstore-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime