_schema-version: "3.3"
ID: bookstore
version: 1.0.0
description: Bookstore CAP Application

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
        - node scripts/fix-hdi-deploy.js

modules:

  - name: bookstore-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: gamma-db-hana
      - name: bookstore-auth

  - name: bookstore-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: gamma-db-hana

  - name: project1
    type: html5
    path: app/project1
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: bookstore-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: bookstore-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: artifacts/
      requires:
        - name: project1
          artifacts:
            - project1.zip
          target-path: artifacts/

  - name: bookstore-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 256M
      keep-existing-routes: true
    requires:
      - name: bookstore-auth
      - name: bookstore-destination-service
      - name: bookstore-html5-runtime
      - name: srv-api
        group: destinations
        properties:
          name: bookstore_srv
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: false

resources:

  - name: gamma-db-hana
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: bookstore-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json



  - name: bookstore-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                URL: https://ui5.sap.com
                ProxyType: Internet
                Type: HTTP
                Authentication: NoAuthentication

  - name: bookstore-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: bookstore-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime